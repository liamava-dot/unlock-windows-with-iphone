name: Windows CI

on:
  push:
    branches: [liamava]
  pull_request:
    branches: [dev, main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Test and build ${{ matrix.architecture }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - architecture: x64
            runner: windows-2022
          - architecture: arm64
            runner: windows-11-arm
    defaults:
      run:
        working-directory: windows
    env:
      UNLOCK_TARGET_ARCH: ${{ matrix.architecture }}
      UNLOCK_VS_DEV_CMD: auto
    steps:
      - name: Check out branch or PR revision
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Prepare Windows build environment
        shell: cmd
        run: |
          if not exist "..\\.tmp" mkdir "..\\.tmp"
          if errorlevel 1 exit /b %errorlevel%
          set "TEMP=%CD%\\..\\.tmp"
          set "TMP=%TEMP%"
          powershell.exe -NoProfile -ExecutionPolicy Bypass -File WindowsBuild.ps1 -Prepare -OutputDirectory build
          if errorlevel 1 exit /b %errorlevel%

      - name: Run all Release tests
        shell: cmd
        run: |
          set "TEMP=%CD%\\..\\.tmp"
          set "TMP=%TEMP%"
          powershell.exe -NoProfile -ExecutionPolicy Bypass -File WindowsBuild.ps1 -InvokeMSBuild "UnlockWindowsTests.proj" /t:Test /m:1 /nologo "/p:Configuration=Release" "/p:UnlockBuildDirectory=%CD%\\build" "/p:BuildTesting=ON"
          if errorlevel 1 exit /b %errorlevel%

      - name: Build Release solution
        shell: cmd
        run: |
          set "TEMP=%CD%\\..\\.tmp"
          set "TMP=%TEMP%"
          powershell.exe -NoProfile -ExecutionPolicy Bypass -File WindowsBuild.ps1 -InvokeMSBuild "UnlockWindows.sln" /restore /m /nologo "/p:Configuration=Release" "/p:UnlockBuildDirectory=%CD%\\build" "/p:BuildTesting=OFF"
          if errorlevel 1 exit /b %errorlevel%

      - name: Determine snapshot artifact name
        id: snapshot
        shell: pwsh
        run: |
          . .\\WindowsBuild.ps1
          $metadata = Get-ProductBuildMetadata -Architecture $env:UNLOCK_TARGET_ARCH
          "name=$([IO.Path]::GetFileNameWithoutExtension($metadata.SetupFile))-SNAPSHOT($($metadata.Build))" >> $env:GITHUB_OUTPUT
          "path=windows/dist/$($metadata.SetupFile)" >> $env:GITHUB_OUTPUT

      - name: Upload snapshot installer
        uses: actions/upload-artifact@v7
        with:
          name: ${{ steps.snapshot.outputs.name }}
          path: ${{ steps.snapshot.outputs.path }}
          if-no-files-found: error
